<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Tracker — IARS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>

:root{
  --ink:#10192E;
  --ink-soft:#3B4661;
  --paper:#F3F4F7;
  --card:#FFFFFF;
  --line:#E2E4EA;
  --brass:#B9903F;
  --brass-deep:#8F6C28;
  --good:#2F7A56;
  --good-bg:#E6F2EC;
  --warn:#B9903F;
  --warn-bg:#FBF3E3;
  --bad:#B0392B;
  --bad-bg:#FBEAE7;
  --radius:14px;
  --shadow: 0 1px 2px rgba(16,25,46,0.04), 0 8px 24px rgba(16,25,46,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
.mono{font-family:'IBM Plex Mono',monospace;}
h1,h2,h3{font-family:'Fraunces',serif;margin:0;letter-spacing:-0.01em;}
a{color:inherit;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
::selection{background:#D9C48A;}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0 22px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{
  width:46px;height:46px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow: var(--shadow); border:1px solid var(--line); flex:none;
  color:#fff;font-family:'Fraunces',serif;font-weight:700;font-size:18px;
}
.brand-text h1{font-size:20px;font-weight:600;}
.brand-text span{font-size:12px;color:var(--ink-soft);letter-spacing:.03em;text-transform:uppercase;}

.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:12px;border:1px solid var(--line);}
.tab{padding:9px 16px;border:none;background:transparent;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-soft);}
.tab.active{background:var(--ink);color:#fff;}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.pad{padding:22px;}

.grid-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
@media (max-width:820px){.grid-summary{grid-template-columns:repeat(2,1fr);}}
.stat{padding:18px 18px;}
.stat .n{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1;}
.stat .l{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:6px;}

/* table */
.table-scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:14px;}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:10px 12px;white-space:nowrap;}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:hover{background:#FAFAFB;}
.name-cell{font-weight:600;}
.grp-badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#EEF0F5;color:var(--ink-soft);}
.status-pill{padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:700;}
.status-pill.pass{background:var(--good-bg);color:var(--good);}
.status-pill.risk{background:var(--warn-bg);color:var(--brass-deep);}
.status-pill.none{background:#EEF0F5;color:var(--ink-soft);}

/* controls */
select, input[type=text], input[type=date]{
  font-family:'Inter',sans-serif;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px;color:var(--ink);
}
.btn{padding:10px 16px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;}
.btn.secondary{background:#fff;color:var(--ink);}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-soft);}
.btn.danger{background:#fff;border-color:var(--bad);color:var(--bad);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.row-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}

/* courses list */
.course-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.course-row:last-child{border-bottom:none;}
.course-idx{font-family:'IBM Plex Mono',monospace;color:var(--brass-deep);font-size:12px;width:26px;}
.course-name{font-weight:600;flex:1;min-width:220px;}

/* checkin view */
.checkin-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 0%, #1C2A4A 0%, #0D1526 65%);}
.checkin-card{max-width:420px;width:100%;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.4);}
.checkin-head{background:linear-gradient(155deg,var(--ink), #24345C);color:#fff;padding:30px 26px 24px;text-align:center;}
.checkin-head .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);margin-bottom:8px;}
.checkin-head h2{font-size:22px;font-weight:600;line-height:1.25;}
.checkin-body{padding:26px;}
.field-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:8px;display:block;}
.checkin-body select, .checkin-body input{width:100%;padding:13px 14px;font-size:15px;}
.confirm-btn{width:100%;padding:15px;font-size:15px;margin-top:16px;border-radius:11px;}
.result-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:30px;}
.result-icon.ok{background:var(--good-bg);color:var(--good);}
.result-icon.warn{background:var(--warn-bg);color:var(--brass-deep);}
.result-icon.err{background:var(--bad-bg);color:var(--bad);}
.result-title{text-align:center;font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:6px;}
.result-sub{text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.5;}
.progress-track{height:8px;background:#EEF0F5;border-radius:20px;overflow:hidden;margin:18px 0 6px;}
.progress-fill{height:100%;background:var(--good);border-radius:20px;transition:width .5s;}

.pin-note{font-size:12px;color:var(--ink-soft);margin-top:10px;text-align:center;}
.footer-note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:26px;line-height:1.6;}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 4px;flex-wrap:wrap;gap:10px;}

/* day-select buttons */
.day-select{display:flex;gap:10px;}
.day-btn{flex:1;padding:14px;border-radius:11px;border:2px solid var(--line);background:#fff;color:var(--ink);font-size:15px;font-weight:700;transition:all .15s;}
.day-btn.picked{border-color:var(--ink);background:var(--ink);color:#fff;}
.day-btn:disabled{opacity:.5;}

/* dashboard course-attendance table */
.course-cell{text-align:center;font-size:14px;}
.course-cell .yes{color:var(--good);font-weight:700;}
.course-cell .no{color:var(--line);}
.overall-pct{font-family:'IBM Plex Mono',monospace;font-weight:700;}
.search-box{flex:1;min-width:180px;}
.qr-panel{padding:30px;text-align:center;}
.qr-panel .qr-frame{border:8px solid var(--ink);border-radius:16px;display:inline-block;padding:14px;background:#fff;}
.qr-link-box{font-size:12.5px;color:var(--ink-soft);word-break:break-all;background:var(--paper);padding:10px 12px;border-radius:8px;margin:14px auto 0;max-width:420px;}
.coord-link{position:fixed;bottom:14px;right:16px;font-size:11px;color:rgba(255,255,255,.45);text-decoration:none;}
.coord-link:hover{color:rgba(255,255,255,.8);}

/* connection error banner (new) */
.retry-btn{margin-top:14px;}
.err-detail{font-size:11px;color:var(--ink-soft);margin-top:14px;background:var(--paper);padding:8px 10px;border-radius:8px;word-break:break-word;}
</style>
</head>

/* Returns the scheduled date string for a course/group/day, or a plain "Day 1"/"Day 2"
   fallback when no date has been set yet (see courses tab to fill these in). */
function courseDayLabel(course, group, dayNum){
  const g = (group === "A" || group === "B") ? group : null;
  const fallback = "Day " + dayNum;
  if(!course || !g || !course.dates || !course.dates[g]) return fallback;
  const d = course.dates[g][dayNum-1];
  return d && d.trim() ? d : fallback;
}

   { learners, courses, admin_pin, attendance: { "<courseId>_<learnerId>": {courseId,learnerId,day1,day2} } } */
const JSONBIN_ID = "6a4e1a54da38895dfe3f7fb8";
const JSONBIN_KEY = "$2a$10$6JzXAzHmKEUL2WTi/Dh6F.ThHEpSZnZoPVaYBPLdHKREY3FyIEhMi";
const JSONBIN_BASE = "https://api.jsonbin.io/v3/b/" + JSONBIN_ID;

function withTimeout(promise, ms=12000){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error("Timed out talking to the database.")), ms))
  ]);
}

async function readBin(){
  const res = await withTimeout(fetch(JSONBIN_BASE + "/latest", {
    headers: { "X-Master-Key": JSONBIN_KEY }
  }));
  if(!res.ok){ const e = new Error("JSONBin read failed"); e.code = "http_"+res.status; throw e; }
  const json = await res.json();
  return json.record || {};
}

async function writeBin(record){
  const res = await withTimeout(fetch(JSONBIN_BASE, {
    method: "PUT",
    headers: { "X-Master-Key": JSONBIN_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(record)
  }));
  if(!res.ok){ const e = new Error("JSONBin write failed"); e.code = "http_"+res.status; throw e; }
  return true;
}

/* ---------------- STORAGE HELPERS (simple key/value, backed by the bin record) ---------------- */
async function sget(key){
  const record = await readBin();
  return record[key] === undefined ? null : record[key];
}
async function sset(key, val){
  const record = await readBin();
  record[key] = val;
  await writeBin(record);
  return true;
}

async function getAdminPin(){
  const stored = await sget("admin_pin");
  return stored || DEFAULT_ADMIN_PIN;
}
async function setAdminPin(newPin){ return sset("admin_pin", newPin); }

async function setLearnerPin(learnerId, pin){
  const record = await readBin();
  const learners = record.learners || [];
  const l = learners.find(x=>x.id===learnerId);
  if(l) l.pin = pin;
  await writeBin(record);
  return learners;
}

/* Binds this browser's device id to a learner. Re-registering elsewhere for the same
   learner overwrites the old value, which automatically un-trusts the previous device
   (only the most recently registered device matches per learner). */
async function setLearnerDevice(learnerId, deviceId){
  const record = await readBin();
  const learners = record.learners || [];
  const l = learners.find(x=>x.id===learnerId);
  if(l) l.device = deviceId;
  await writeBin(record);
  return learners;
}

/* A stable random id for this browser/device, created once and kept in localStorage.
   This is what makes "this phone" recognizable on future visits. */
function getOrCreateDeviceId(){
  const key = "attendance_device_id";
  let id = localStorage.getItem(key);
  if(!id){
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : "dev-" + Date.now() + "-" + Math.random().toString(36).slice(2);
    localStorage.setItem(key, id);
  }
  return id;
}

async function ensureSeeded(){
  const record = await readBin();
  let changed = false;
  if(!record.learners){ record.learners = SEED_LEARNERS; changed = true; }
  if(!record.courses){ record.courses = SEED_COURSES; changed = true; }
  if(!record.attendance){ record.attendance = {}; changed = true; }
  // migrate older records: every course needs a visibility flag (learners with no PIN yet will set one on their next check-in)
  record.courses.forEach(c=>{ if(c.enabled === undefined){ c.enabled = true; changed = true; } });
  // migrate older records: every course needs a per-group dates object (added for the Day 1/Day 2 calendar dates + report)
  record.courses.forEach(c=>{ if(!c.dates){ c.dates = { A:["",""], B:["",""] }; changed = true; } });
  // migrate older records: every learner needs a device field (registered device trust)
  record.learners.forEach(l=>{ if(l.device === undefined){ l.device = null; changed = true; } });
  if(changed) await writeBin(record);
  return {learners: record.learners, courses: record.courses};
}

/* ---------------- ATTENDANCE (stored as fields keyed by courseId_learnerId) ---------------- */
function attDocId(courseId, learnerId){ return courseId+"_"+learnerId; }

async function getAttendance(courseId, learnerId){
  const record = await readBin();
  const d = (record.attendance && record.attendance[attDocId(courseId, learnerId)]) || {};
  return {day1: d.day1 || null, day2: d.day2 || null};
}

/* Records one day's attendance without ever touching the other day's field —
   re-reads the bin fresh right before writing to minimize clobbering concurrent check-ins. */
async function recordAttendance(courseId, learnerId, dayNum){
  const field = "day"+dayNum;
  const record = await readBin();
  if(!record.attendance) record.attendance = {};
  const id = attDocId(courseId, learnerId);
  const before = record.attendance[id] || {};
  const already = !!before[field];
  if(!already){
    record.attendance[id] = { ...before, courseId, learnerId, [field]: new Date().toISOString() };
    await writeBin(record);
  }
  const after = record.attendance[id] || before;
  return {ok:true, already, rec: {day1: after.day1||null, day2: after.day2||null}};
}

async function getLearnerAttendance(learnerId){
  const record = await readBin();
  const map = {};
  for(const id in (record.attendance || {})){
    const d = record.attendance[id];
    if(d.learnerId === learnerId) map[d.courseId] = {day1:d.day1||null, day2:d.day2||null};
  }
  return map;
}

async function getAllAttendance(){
  const record = await readBin();
  const map = {}; // learnerId -> courseId -> {day1,day2}
  for(const id in (record.attendance || {})){
    const d = record.attendance[id];
    if(!map[d.learnerId]) map[d.learnerId] = {};
    map[d.learnerId][d.courseId] = {day1:d.day1||null, day2:d.day2||null};
  }
  return map;
}

async function deleteAllAttendance(){
  const record = await readBin();
  record.attendance = {};
  await writeBin(record);
}

/* ---------------- STATS ---------------- */
function courseAttended(rec){ return !!(rec && (rec.day1 || rec.day2)); }
function daysAttended(rec){ return rec ? (rec.day1?1:0) + (rec.day2?1:0) : 0; }
function learnerStats(attByCourse, totalCourses){
  let count = 0;
  for(const c in attByCourse){ count += daysAttended(attByCourse[c]); }
  const totalDays = totalCourses * 2; // each course runs across 2 days
  const pct = totalDays ? Math.round((count/totalDays)*100) : 0;
  const pass = totalDays ? (count/totalDays) >= PASS_THRESHOLD : false;
  return {count, total: totalDays, pct, pass};
}

/* ---------------- CONNECTION ERROR SCREEN (new) ---------------- */
function showConnectionError(err, retryFn){
  const app = document.getElementById("app");
  const code = err && err.code || "";
  const isAuth = code === "http_401" || code === "http_403";
  const isNotFound = code === "http_404";
  let sub = "Couldn't reach the database. Check your internet connection and try again.";
  if(isAuth) sub = "The database rejected the request (unauthorized). A coordinator needs to check the JSONBin API key in the app's code.";
  if(isNotFound) sub = "The database bin wasn't found. A coordinator needs to check the JSONBin Bin ID in the app's code.";
  app.innerHTML = `<div class="checkin-wrap"><div class="checkin-card" style="max-width:420px;">
    <div class="checkin-head"><div class="eyebrow">${EYEBROW_LOGO}</div><h2>Can't reach the database</h2></div>
    <div class="checkin-body">
      <div class="result-icon err">✕</div>
      <div class="result-title">Connection failed</div>
      <div class="result-sub">${sub}</div>
      <button class="btn confirm-btn retry-btn" id="retry-btn">Try again</button>
      <div class="err-detail mono">${(err && (err.code || err.message)) || "Unknown error"}</div>
    </div>
  </div></div>`;
  document.getElementById("retry-btn").onclick = retryFn;
}

/* ================= CHECK-IN VIEW ================= */
async function renderCheckin(){
  const app = document.getElementById("app");
  app.innerHTML = `<div class="checkin-wrap"><div class="checkin-card" id="ci-card">
    <div class="checkin-head"><div class="eyebrow">${EYEBROW_LOGO}</div><h2>Loading…</h2></div>
    <div class="checkin-body"></div></div>
    <a href="?admin=1" class="coord-link">Coordinator sign-in</a></div>`;

  let learners, courses;
  try{
    ({learners, courses} = await ensureSeeded());
  }catch(err){
    showConnectionError(err, renderCheckin);
    return;
  }

  const card = document.getElementById("ci-card");
  const deviceId = getOrCreateDeviceId();
  const trustedLearner = learners.find(l=>l.device && l.device === deviceId) || null;

  if(trustedLearner){
    renderTrustedCheckin(card, trustedLearner, learners, courses, deviceId);
  } else {
    renderRegisterCheckin(card, learners, courses, deviceId);
  }
}

/* Fast path: this device is already trusted for a specific learner.
   No name picking, no PIN — just course + day + Sign In. */
function renderTrustedCheckin(card, learner, learners, courses, deviceId){
  const visibleCourses = courses.filter(c=>c.enabled !== false);
  const courseOptions = visibleCourses.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");

  card.innerHTML = `
    <div class="checkin-head">
      <div class="eyebrow">${EYEBROW_LOGO}</div>
      <h2>Welcome back, ${learner.name}</h2>
    </div>
    <div class="checkin-body">
      <label class="field-label">Course</label>
      <select id="ci-course">
        <option value="">— Choose the course —</option>
        ${courseOptions}
      </select>

      <label class="field-label" style="margin-top:16px;">Which day is this?</label>
      <div class="day-select">
        <button class="day-btn" id="ci-day1" data-day="1">Day 1</button>
        <button class="day-btn" id="ci-day2" data-day="2">Day 2</button>
      </div>

      <button class="btn confirm-btn" id="ci-submit" disabled>Sign In</button>
      <div class="pin-note">This device is recognized as yours, so no PIN is needed. <a href="#" id="ci-not-you">Not ${learner.name}?</a></div>
    </div>`;

  let pickedDay = null;
  const courseSel = document.getElementById("ci-course");
  const day1Btn = document.getElementById("ci-day1");
  const day2Btn = document.getElementById("ci-day2");
  const submitBtn = document.getElementById("ci-submit");

  function refreshSubmit(){ submitBtn.disabled = !(courseSel.value && pickedDay); }
  function refreshDayLabels(){
    const course = courses.find(c=>c.id===courseSel.value);
    day1Btn.textContent = courseDayLabel(course, learner.group, 1);
    day2Btn.textContent = courseDayLabel(course, learner.group, 2);
  }
  function pickDay(day){
    pickedDay = day;
    day1Btn.classList.toggle("picked", day===1);
    day2Btn.classList.toggle("picked", day===2);
    refreshSubmit();
  }
  courseSel.onchange = ()=>{ refreshDayLabels(); refreshSubmit(); };
  day1Btn.onclick = ()=>pickDay(1);
  day2Btn.onclick = ()=>pickDay(2);
  refreshDayLabels();

  document.getElementById("ci-not-you").onclick = (e)=>{
    e.preventDefault();
    if(!confirm(`Remove this device's trust for ${learner.name}? You'll need to re-register (name + PIN) to check in on this device again.`)) return;
    localStorage.removeItem("attendance_device_id");
    renderCheckin();
  };

  submitBtn.onclick = async ()=>{
    const course = courses.find(c=>c.id===courseSel.value);
    day1Btn.disabled = true; day2Btn.disabled = true;
    submitBtn.disabled = true; submitBtn.textContent = "Signing in…";
    await submitCheckin(course, learner, pickedDay, courses, card);
  };
}

/* Registration path: unrecognized device. Learner picks their name, then either sets
   a PIN (first time ever) or enters their existing PIN (first time on THIS device).
   A correct submit here binds this device to the learner going forward. */
function renderRegisterCheckin(card, learners, courses, deviceId){
  const groupsPresent = [];
  if(learners.some(l=>l.group==="A")) groupsPresent.push({value:"A", label:"Group A"});
  if(learners.some(l=>l.group==="B")) groupsPresent.push({value:"B", label:"Group B"});
  if(learners.some(l=>!l.group)) groupsPresent.push({value:"__none__", label:"Not listed above"});
  const groupOptions = groupsPresent.map(g=>`<option value="${g.value}">${g.label}</option>`).join("");

  const visibleCourses = courses.filter(c=>c.enabled !== false);
  const courseOptions = visibleCourses.map(c=>`<option value="${c.id}">${c.name}</option>`).join("");

  card.innerHTML = `
    <div class="checkin-head">
      <div class="eyebrow">${EYEBROW_LOGO}</div>
      <h2>Sign in to attendance</h2>
    </div>
    <div class="checkin-body">
      <label class="field-label">Your group</label>
      <select id="ci-group">
        <option value="">— Choose your group —</option>
        ${groupOptions}
      </select>

      <label class="field-label" style="margin-top:16px;">Your name</label>
      <select id="ci-learner" disabled>
        <option value="">— Choose your group first —</option>
      </select>

      <label class="field-label" style="margin-top:16px;">Course</label>
      <select id="ci-course">
        <option value="">— Choose the course —</option>
        ${courseOptions}
      </select>

      <div id="ci-pin-section"></div>

      <label class="field-label" style="margin-top:6px;">Which day is this?</label>
      <div class="day-select">
        <button class="day-btn" id="ci-day1" data-day="1">Day 1</button>
        <button class="day-btn" id="ci-day2" data-day="2">Day 2</button>
      </div>

      <button class="btn confirm-btn" id="ci-submit" disabled>Sign In</button>
      <div class="pin-note">This registers your PIN once <em>and</em> trusts this device — after today, checking in from this same phone/iPad won't ask for it again. Only use your own device; shared or borrowed devices won't work for check-in.</div>
    </div>`;

  let pickedDay = null;
  const groupSel = document.getElementById("ci-group");
  const learnerSel = document.getElementById("ci-learner");
  const courseSel = document.getElementById("ci-course");
  const pinSection = document.getElementById("ci-pin-section");
  const day1Btn = document.getElementById("ci-day1");
  const day2Btn = document.getElementById("ci-day2");
  const submitBtn = document.getElementById("ci-submit");

  function currentLearner(){ return learners.find(l=>l.id===learnerSel.value) || null; }

  function renderPinSection(){
    const learner = currentLearner();
    if(!learner){ pinSection.innerHTML = ""; return; }
    if(!learner.pin){
      pinSection.innerHTML = `
        <label class="field-label" style="margin-top:16px;">Create a check-in PIN</label>
        <div style="color:var(--ink-soft);font-size:12.5px;margin:-2px 0 8px;">First time signing in — pick a 4-digit PIN you'll remember (e.g. the last 4 digits of your phone number). You'll use this same PIN every time you check in from now on.</div>
        <input type="password" id="ci-pin-new" inputmode="numeric" autocomplete="off" placeholder="Choose a 4-digit PIN" maxlength="4">
        <input type="password" id="ci-pin-confirm" inputmode="numeric" autocomplete="off" placeholder="Confirm PIN" maxlength="4" style="margin-top:8px;">
        <div class="pin-note" id="ci-pin-error" style="color:var(--bad);min-height:16px;"></div>`;
    } else {
      pinSection.innerHTML = `
        <label class="field-label" style="margin-top:16px;">Your check-in PIN</label>
        <input type="password" id="ci-pin" inputmode="numeric" autocomplete="off" placeholder="4-digit PIN" maxlength="4">
        <div class="pin-note" id="ci-pin-error" style="color:var(--bad);min-height:16px;"></div>`;
    }
    pinSection.querySelectorAll("input").forEach(inp=>{
      inp.oninput = ()=>{ document.getElementById("ci-pin-error").textContent=""; refreshSubmit(); };
    });
  }

  function refreshSubmit(){
    const learner = currentLearner();
    let pinReady = false;
    if(learner){
      if(!learner.pin){
        const a = document.getElementById("ci-pin-new");
        const b = document.getElementById("ci-pin-confirm");
        pinReady = !!(a && b && a.value.trim().length===4 && b.value.trim().length===4);
      } else {
        const p = document.getElementById("ci-pin");
        pinReady = !!(p && p.value.trim().length===4);
      }
    }
    submitBtn.disabled = !(learnerSel.value && courseSel.value && pickedDay && pinReady);
  }
  function pickDay(day){
    pickedDay = day;
    day1Btn.classList.toggle("picked", day===1);
    day2Btn.classList.toggle("picked", day===2);
    refreshSubmit();
  }
  function refreshDayLabels(){
    const course = courses.find(c=>c.id===courseSel.value);
    const learner = currentLearner();
    const group = learner ? learner.group : (groupSel.value !== "__none__" ? groupSel.value : null);
    day1Btn.textContent = courseDayLabel(course, group, 1);
    day2Btn.textContent = courseDayLabel(course, group, 2);
  }
  function populateLearnersForGroup(){
    const g = groupSel.value;
    if(!g){
      learnerSel.disabled = true;
      learnerSel.innerHTML = `<option value="">— Choose your group first —</option>`;
      return;
    }
    const filtered = learners
      .filter(l => g==="__none__" ? !l.group : l.group===g)
      .slice().sort((a,b)=>a.name.localeCompare(b.name));
    const options = filtered.map(l=>`<option value="${l.id}">${l.name}</option>`).join("");
    learnerSel.disabled = false;
    learnerSel.innerHTML = `<option value="">— Choose your name —</option>${options}`;
    pinSection.innerHTML = "";
  }

  groupSel.onchange = ()=>{ populateLearnersForGroup(); refreshDayLabels(); refreshSubmit(); };
  learnerSel.onchange = ()=>{ renderPinSection(); refreshDayLabels(); refreshSubmit(); };
  courseSel.onchange = ()=>{ refreshDayLabels(); refreshSubmit(); };
  day1Btn.onclick = ()=>pickDay(1);
  day2Btn.onclick = ()=>pickDay(2);
  refreshDayLabels();

  submitBtn.onclick = async ()=>{
    const learner = currentLearner();
    const course = courses.find(c=>c.id===courseSel.value);
    const pinError = document.getElementById("ci-pin-error");

    if(!learner.pin){
      const a = document.getElementById("ci-pin-new").value.trim();
      const b = document.getElementById("ci-pin-confirm").value.trim();
      if(a.length!==4 || !/^\d{4}$/.test(a)){
        pinError.textContent = "PIN must be exactly 4 digits.";
        return;
      }
      if(a !== b){
        pinError.textContent = "PINs don't match — try again.";
        document.getElementById("ci-pin-new").value = "";
        document.getElementById("ci-pin-confirm").value = "";
        return;
      }
      submitBtn.disabled = true; submitBtn.textContent = "Saving your PIN…";
      await setLearnerPin(learner.id, a);
      learner.pin = a;
    } else {
      const entered = document.getElementById("ci-pin").value.trim();
      if(entered !== learner.pin){
        pinError.textContent = "That PIN doesn't match this name. Ask your coordinator to reset it if you've forgotten it.";
        document.getElementById("ci-pin").value = "";
        document.getElementById("ci-pin").focus();
        return;
      }
    }

    day1Btn.disabled = true; day2Btn.disabled = true;
    submitBtn.disabled = true; submitBtn.textContent = "Signing in…";
    // A correct PIN (new or existing) confirms this is really the learner —
    // bind this device to them so future visits skip the PIN entirely.
    try{ await setLearnerDevice(learner.id, deviceId); }catch(err){ /* attendance can still proceed even if device binding fails */ }
    await submitCheckin(course, learner, pickedDay, courses, card);
  };
}

async function submitCheckin(course, learner, dayNum, courses, card){
  let result;
  try{
    result = await recordAttendance(course.id, learner.id, dayNum);
  }catch(err){
    result = {ok:false};
  }

  card.querySelector(".checkin-head").innerHTML = `<div class="eyebrow">${EYEBROW_LOGO}</div><h2>${course.name}</h2>`;

  if(!result.ok){
    card.querySelector(".checkin-body").innerHTML = `
      <div class="result-icon err">✕</div>
      <div class="result-title">Couldn't save your check-in</div>
      <div class="result-sub">There was a problem reaching the database. Please check your connection and scan again — nothing was recorded yet.</div>
      <button class="btn secondary confirm-btn" id="ci-retry">Try again</button>
    `;
    document.getElementById("ci-retry").onclick = ()=> renderCheckin();
    return;
  }

  let icon, title, sub;
  if(!result.already){
    icon = '<div class="result-icon ok">✓</div>';
    title = "Attendance recorded";
    sub = `Thanks, ${learner.name}. Your attendance for Day ${dayNum} of "${course.name}" has been saved.`;
  } else {
    icon = '<div class="result-icon warn">↺</div>';
    title = "Already recorded";
    sub = `${learner.name}, your attendance for "${course.name}" was already logged.`;
  }

  card.querySelector(".checkin-body").innerHTML = `
    ${icon}
    <div class="result-title">${title}</div>
    <div class="result-sub">${sub}</div>
    <button class="btn secondary confirm-btn" id="ci-again">Sign in another attendance</button>
  `;
  document.getElementById("ci-again").onclick = ()=> renderCheckin();
}

/* ================= ADMIN VIEW ================= */
const STATE = { learners: [], courses: [], attendance: {}, activeTab: "dashboard", search: "", groupFilter: "", reportSearch: "", reportGroupFilter: "", reportCourseFilter: "" };

async function renderAdmin(){
  if(sessionStorage.getItem("admin_unlocked") === "true"){
    await startAdmin();
  } else {
    renderAdminLogin();
  }
}

async function startAdmin(){
  const app = document.getElementById("app");
  app.innerHTML = `<div class="checkin-wrap"><div class="checkin-card" style="max-width:340px;">
    <div class="checkin-head"><div class="eyebrow">${EYEBROW_LOGO}</div><h2>Loading dashboard…</h2></div>
    <div class="checkin-body"></div></div></div>`;

  try{
    const [{learners, courses}, attendance] = await Promise.all([ensureSeeded(), getAllAttendance()]);
    STATE.learners = learners;
    STATE.courses = courses;
    STATE.attendance = attendance;
    paintShell();
  }catch(err){
    showConnectionError(err, startAdmin);
  }
}

function renderAdminLogin(err){
  const app = document.getElementById("app");
  app.innerHTML = `<div class="checkin-wrap"><div class="checkin-card" style="max-width:380px;">
    <div class="checkin-head"><div class="eyebrow">${EYEBROW_LOGO}</div><h2>Coordinator sign-in</h2></div>
    <div class="checkin-body">
      <label class="field-label">Admin PIN</label>
      <input type="password" id="admin-pin-input" inputmode="numeric" autocomplete="off" placeholder="Enter PIN">
      ${err ? `<div style="color:var(--bad);font-size:13px;margin-top:8px;">${err}</div>` : ''}
      <button class="btn confirm-btn" id="admin-login-btn">Unlock dashboard</button>
      <div class="pin-note">This screen only protects the coordinator dashboard. Learners checking in never see this.</div>
    </div>
  </div></div>`;

  const submit = async ()=>{
    const val = document.getElementById("admin-pin-input").value.trim();
    const btn = document.getElementById("admin-login-btn");
    btn.disabled = true; btn.textContent = "Checking…";
    try{
      const pin = await getAdminPin();
      if(val && val === pin){
        sessionStorage.setItem("admin_unlocked", "true");
        await startAdmin();
      } else {
        renderAdminLogin("Incorrect PIN. Please try again.");
      }
    }catch(err){
      showConnectionError(err, renderAdmin);
    }
  };
  document.getElementById("admin-login-btn").onclick = submit;
  document.getElementById("admin-pin-input").onkeydown = (e)=>{ if(e.key==="Enter") submit(); };
  document.getElementById("admin-pin-input").focus();
}

/* ---- Dashboard ---- */
function groupLabel(g){ return g ? `Group ${g}` : "No group"; }

/* Tallies UNIQUE learners checked in on each real calendar date, split by group.
   A learner who checks into two different courses on the same day is only counted
   once for that day/group — this answers "how many learners showed up that day",
   not "how many check-in events happened". */
function computeDailyGroupAttendance(){
  const dateMap = {}; // date string -> groupKey -> Set(learnerId)
  STATE.learners.forEach(l=>{
    const g = l.group || "__none__";
    const attByCourse = STATE.attendance[l.id] || {};
    Object.values(attByCourse).forEach(rec=>{
      ["day1","day2"].forEach(field=>{
        const ts = rec[field];
        if(!ts) return;
        const date = new Date(ts).toLocaleDateString();
        if(!dateMap[date]) dateMap[date] = {};
        if(!dateMap[date][g]) dateMap[date][g] = new Set();
        dateMap[date][g].add(l.id);
      });
    });
  });
  return Object.keys(dateMap)
    .sort((a,b)=> new Date(a) - new Date(b))
    .map(date=>{
      const groups = dateMap[date];
      const counts = {};
      let total = 0;
      for(const g in groups){ counts[g] = groups[g].size; total += groups[g].size; }
      return { date, counts, total };
    });
}

function paintDashboard(content){

    .sort((a,b)=>a.name.localeCompare(b.name));
  const courses = STATE.courses;

  const allStats = STATE.learners.map(l => learnerStats(STATE.attendance[l.id]||{}, courses.length));
  const avgPct = allStats.length ? Math.round(allStats.reduce((s,x)=>s+x.pct,0)/allStats.length) : 0;
  const passCount = allStats.filter(x=>x.pass).length;
  const riskCount = allStats.length - passCount;

  // Per-group breakdown, so a coordinator can see each group's standing at a glance
  const groupKeys = Array.from(new Set(STATE.learners.map(l=>l.group || "__none__")))
    .sort((a,b)=> a==="__none__" ? 1 : b==="__none__" ? -1 : a.localeCompare(b));

    const pct = stats.length ? Math.round(stats.reduce((s,x)=>s+x.pct,0)/stats.length) : 0;
    const pass = stats.filter(x=>x.pass).length;
    return { key: g, label: groupLabel(g==="__none__"?"":g), count: members.length, pct, pass, risk: members.length - pass };
  });

  const groupOptions = groupKeys.map(g=>`<option value="${g}" ${STATE.groupFilter===g?'selected':''}>${groupLabel(g==="__none__"?"":g)}</option>`).join("");

      <div class="card stat"><div class="n">${passCount}</div><div class="l">Passing (≥80%)</div></div>
      <div class="card stat"><div class="n">${riskCount}</div><div class="l">At Risk</div></div>

          <tbody>
            ${groupStats.map(g=>`
              <tr>
                <td class="name-cell">${g.key!=="__none__"?`<span class="grp-badge">${g.key}</span> `:''}${g.label}</td>
                <td>${g.count}</td>
                <td class="overall-pct">${g.pct}%</td>
                <td>${g.pass}</td>
                <td>${g.risk}</td>
                <td><button class="btn ghost" data-view-group="${g.key}" style="padding:5px 12px;font-size:12.5px;">View</button></td>

        </table>
      </div>
    </div>
    <div class="card" style="margin-bottom:22px;">
      <div class="section-head"><h3 style="font-size:16px;">Daily Attendance by Group</h3></div>
      <p style="padding:0 20px 14px;color:var(--ink-soft);font-size:13px;margin:0;">Unique learners checked in on each date, split by group. A learner checking into more than one course on the same day is only counted once for that day.</p>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>Date</th>
            ${groupKeys.map(g=>`<th>${g==="__none__"?"No Group":"Group "+g}</th>`).join("")}
            <th>Total</th>
          </tr></thead>

function renderDashTable(){
  const learners = STATE.learners.slice()
    .filter(l => l.name.toLowerCase().includes(STATE.search.toLowerCase()))
    .filter(l => !STATE.groupFilter || (STATE.groupFilter==="__none__" ? !l.group : l.group===STATE.groupFilter))
    .sort((a,b)=>a.name.localeCompare(b.name));
  const courses = STATE.courses;
  const table = document.getElementById("dash-table");
  if(!table) return;

  table.innerHTML = `<table>
    <thead><tr>
      <th>Learner</th><th>Group</th>
      ${courses.map((c,i)=>`<th title="${c.name}">C${i+1}</th>`).join("")}
      <th>Attended</th><th>%</th><th>Status</th>
    </tr></thead>
    <tbody>
      ${learners.map(l=>{
        const attByCourse = STATE.attendance[l.id] || {};
        const stats = learnerStats(attByCourse, courses.length);
        const cells = courses.map(c=>{
          const rec = attByCourse[c.id];
          const attended = courseAttended(rec);
          const title = rec ? `Day 1: ${rec.day1?new Date(rec.day1).toLocaleDateString():'—'} / Day 2: ${rec.day2?new Date(rec.day2).toLocaleDateString():'—'}` : "Not attended";
          return `<td class="course-cell" title="${title}"><span class="${attended?'yes':'no'}">${attended?'✓':'–'}</span></td>`;
        }).join("");
        const statusCls = stats.count===0 ? "none" : (stats.pass ? "pass" : "risk");
        const statusLabel = stats.count===0 ? "Not started" : (stats.pass ? "Pass" : "At risk");
        return `<tr>
          <td class="name-cell">${l.name}</td>
          <td>${l.group?`<span class="grp-badge">${l.group}</span>`:''}</td>
          ${cells}
          <td class="overall-pct">${stats.count}/${stats.total}</td>
          <td class="overall-pct">${stats.pct}%</td>
          <td><span class="status-pill ${statusCls}">${statusLabel}</span></td>
        </tr>`;
      }).join("")}
    </tbody>
  </table>`;
}

/* ---- Report: one row per learner × course, with attend/absent per day ---- */
function buildReportRows(){
  const learners = STATE.learners.slice()
    .filter(l => l.name.toLowerCase().includes(STATE.reportSearch.toLowerCase()))
    .filter(l => !STATE.reportGroupFilter || (STATE.reportGroupFilter==="__none__" ? !l.group : l.group===STATE.reportGroupFilter))
    .sort((a,b)=>a.name.localeCompare(b.name));
  const courses = STATE.courses
    .filter(c => !STATE.reportCourseFilter || c.id===STATE.reportCourseFilter);

  const rows = [];
  learners.forEach(l=>{
    const attByCourse = STATE.attendance[l.id] || {};
    courses.forEach(c=>{
      const rec = attByCourse[c.id];
      const day1Ok = !!(rec && rec.day1);
      const day2Ok = !!(rec && rec.day2);
      rows.push({
        learner: l.name,
        group: l.group ? ("Group " + l.group) : "No group",
        course: c.name,
        day1Label: courseDayLabel(c, l.group, 1),
        day1Status: day1Ok ? "Attended" : "Absent",
        day2Label: courseDayLabel(c, l.group, 2),
        day2Status: day2Ok ? "Attended" : "Absent"
      });
    });
  });
  return rows;
}

function csvEscape(v){
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}

function downloadReportCsv(rows){
  const header = ["Learner Name","Group","Course","Day 1","Day 1 Status","Day 2","Day 2 Status"];
  const lines = [header.map(csvEscape).join(",")];
  rows.forEach(r=>{
    lines.push([r.learner, r.group, r.course, r.day1Label, r.day1Status, r.day2Label, r.day2Status].map(csvEscape).join(","));
  });
  const csv = lines.join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `attendance-report-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

          <span class="grp-badge">B</span>
          <input type="text" class="course-date-input" data-id="${c.id}" data-group="B" data-day="1" placeholder="Day 1 date" value="${dB[0]||''}" style="width:150px;font-size:12.5px;">
          <input type="text" class="course-date-input" data-id="${c.id}" data-group="B" data-day="2" placeholder="Day 2 date" value="${dB[1]||''}" style="width:150px;font-size:12.5px;">
        </div>
      </div>
    </div>
  `;}).join("");

  list.querySelectorAll(".course-name-input").forEach(inp=>{
    inp.onfocus = ()=>{ inp.style.borderColor = "var(--line)"; inp.style.background = "#fff"; };
    inp.onchange = async ()=>{
      const c = STATE.courses.find(x=>x.id===inp.dataset.id);
      c.name = inp.value.trim() || c.name;
      await sset("courses", STATE.courses);
    };
  });

  list.querySelectorAll(".course-date-input").forEach(inp=>{
    inp.onchange = async ()=>{
      const c = STATE.courses.find(x=>x.id===inp.dataset.id);
      if(!c.dates) c.dates = { A:["",""], B:["",""] };
      if(!c.dates[inp.dataset.group]) c.dates[inp.dataset.group] = ["",""];
      c.dates[inp.dataset.group][Number(inp.dataset.day)-1] = inp.value.trim();
      await sset("courses", STATE.courses);
    };
  });

  list.querySelectorAll("[data-toggle]").forEach(btn=>{
    btn.onclick = async ()=>{
      const c = STATE.courses.find(x=>x.id===btn.dataset.toggle);
      c.enabled = (c.enabled === false); // flip, defaulting missing/true -> false, false -> true
      await sset("courses", STATE.courses);
      paintCourses(content);
    };
  });

  list.querySelectorAll("[data-del]").forEach(btn=>{
    btn.onclick = async ()=>{
      const c = STATE.courses.find(x=>x.id===btn.dataset.del);
      if(!confirm(`Remove "${c.name}"? This changes the total course count used for the 80% calculation. Attendance history for this course stays in the database.`)) return;
      STATE.courses = STATE.courses.filter(x=>x.id!==btn.dataset.del);
      await sset("courses", STATE.courses);
      paintShell();
    };
  });

  document.getElementById("add-course-btn").onclick = async ()=>{
    const input = document.getElementById("new-course-name");
    const name = input.value.trim();
    if(!name){ input.style.borderColor = "var(--bad)"; return; }
    const id = "C" + Date.now();
    STATE.courses.push({id, name, enabled:true, dates:{A:["",""],B:["",""]}});
    await sset("courses", STATE.courses);
    paintShell();
  };
}

/* ---- QR Code (single shared link for every learner/course/day) ---- */
function paintQr(content){
  const url = window.location.origin + window.location.pathname;
  content.innerHTML = `<div class="card qr-panel">
    <h3 style="font-size:16px;margin-bottom:4px;">Check-in QR Code</h3>
    <p style="color:var(--ink-soft);font-size:13.5px;max-width:420px;margin:0 auto 16px;">
      One code for every course and every day. Learners scan it, then choose their name, the course, and Day 1 or Day 2 themselves.
    </p>
    <div id="qr-canvas" class="qr-frame"></div>
    <div class="qr-link-box">${url}</div>
    <div class="modal-actions" style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;">
      <button class="btn secondary" id="qr-copy-btn">Copy Link</button>
      <button class="btn" id="qr-print-btn">Print</button>
    </div>
  </div>`;

  new QRCode(document.getElementById("qr-canvas"), {
    text: url, width: 220, height: 220,
    colorDark: "#10192E", colorLight: "#ffffff"
  });

  document.getElementById("qr-copy-btn").onclick = ()=>{
    navigator.clipboard.writeText(url).then(()=>{
      const btn = document.getElementById("qr-copy-btn");
      const old = btn.textContent; btn.textContent = "Copied!";
      setTimeout(()=>{ btn.textContent = old; }, 1500);
    });
  };
  document.getElementById("qr-print-btn").onclick = ()=> window.print();
}

/* ---- Settings actions ---- */
async function changeAdminPin(){
  const current = await getAdminPin();
  const entered = prompt("Enter the current admin PIN:");
  if(entered === null) return;
  if(entered !== current){ alert("Incorrect current PIN. PIN was not changed."); return; }
  const next = prompt("Enter the new admin PIN (share it only with coordinators):");
  if(next === null) return;
  const trimmed = next.trim();
  if(!trimmed){ alert("PIN cannot be empty. PIN was not changed."); return; }
  await setAdminPin(trimmed);
  alert("PIN updated. Share the new PIN with your co-coordinators — the old PIN no longer works.");
}

async function resetAttendanceOnly(){
  const sure = confirm(
    "This clears every learner's check-ins for every course.\n\nLearners and courses are NOT changed.\n\nThis cannot be undone. Continue?"
  );
  if(!sure) return;
  const btn = document.getElementById("reset-att-btn");
  btn.disabled = true; btn.textContent = "Clearing…";

  await deleteAllAttendance();
  STATE.attendance = {};
  paintShell();
}

async function resetAllData(){
  const sure = confirm(
    "FULL RESET\n\nThis will permanently delete ALL learners, courses, and attendance records, and restore the original starting list.\n\nThis cannot be undone. Continue?"
  );
  if(!sure) return;

  const pin = await getAdminPin();
  const check = prompt("Type the admin PIN again to confirm this full reset:");
  if(check === null) return;
  if(check !== pin){
    alert("PIN didn't match — full reset cancelled. Nothing was changed.");
    return;
  }

  const btn = document.getElementById("reset-all-btn");
  btn.disabled = true; btn.textContent = "Resetting…";

  await deleteAllAttendance();
  await sset("learners", SEED_LEARNERS);
  await sset("courses", SEED_COURSES);

  STATE.learners = SEED_LEARNERS;
  STATE.courses = SEED_COURSES;
  STATE.attendance = {};
  STATE.activeTab = "dashboard";
  STATE.search = "";
  STATE.groupFilter = "";
  STATE.reportSearch = "";
  STATE.reportGroupFilter = "";
  STATE.reportCourseFilter = "";

  paintShell();
}
</script>
